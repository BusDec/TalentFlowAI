# GitHub Actions CI/CD for TalentFlowAI
# Triggers on push to main, builds Docker image, deploys to Azure App Service

name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tf-neepco-prod
  AZURE_ACR_NAME: tfneepcoacr
  DOCKER_IMAGE: talentflow

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talentflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: talentflow
          DB_USER: postgres
          DB_PASSWORD: postgres
          DJANGO_SETTINGS_MODULE: config.settings
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          python -m pytest -q --tb=short

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.AZURE_ACR_NAME }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
          docker build -t ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.DOCKER_IMAGE }}:latest .
          docker push ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.DOCKER_IMAGE }}:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Run migrations
        run: |
          az webapp ssh --resource-group tf-neepco-rg --name ${{ env.AZURE_WEBAPP_NAME }} \
            --command "python manage.py migrate_schemas"

      - name: Verify deployment
        run: |
          sleep 30
          curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/ | grep -q "200\|302"
