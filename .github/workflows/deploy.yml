# GitHub Actions CI/CD for TalentFlowAI
# Deploys to Azure App Service (Linux, Python 3.12)

name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tf-neepco-prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '.'
          startup-command: 'bash startup.sh'

      # startup.sh takes 3-5 min (pip install + migrations + seeding)
      - name: Wait for app startup
        run: |
          echo "Waiting 5 min for startup.sh to complete..."
          sleep 300

      - name: Smoke test
        run: |
          BASE="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for path in /health/ /landing/ /login/; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BASE}${path}" --max-time 30 || echo "000")
            echo "$path → $STATUS"
          done
