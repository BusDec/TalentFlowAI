# GitHub Actions CI/CD for TalentFlowAI
# Deploys to Azure App Service (Linux, Python 3.12)

name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tf-neepco-prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          startup-command: 'bash startup.sh'

      - name: Wait for app startup
        run: sleep 60

      - name: Smoke test
        run: |
          for path in / /landing/ /login/; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net${path}" \
              --max-time 15 || echo "000")
            echo "$path → $STATUS"
          done
